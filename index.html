<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seido Social | Digital Presence Around People, Products & Properties</title>
    <meta name="description" content="Seido Social builds and manages high-impact digital presence around people, products, and properties. Specializing in personal branding, public figure positioning, Shopify development, aerial media, and creator campaigns." />
    <meta name="color-scheme" content="light dark" />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Seido Social | Digital Presence Agency" />
    <meta property="og:description" content="We build digital presence around people, products and properties." />
    <meta property="og:image" content="/seido-logo.jpg" />
    <link rel="icon" type="image/jpeg" href="/seido-logo.jpg" />

    <!-- Google Fonts: Syne & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Anti-FOUC Theme Init Script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('seido-theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = stored ? stored : (systemDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
